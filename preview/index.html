<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TaskLoops · Local preview</title>
		<link rel="stylesheet" href="/styles.css" />
		<link rel="stylesheet" href="/preview/theme.css" />
	</head>
	<body>
		<div class="preview-banner">
			<span><strong>TaskLoops</strong> · Local preview · Sample tasks saved in this browser</span>
			<label class="preview-theme-control"
				>Theme
				<select id="preview-theme" aria-label="Preview theme">
					<option value="light">Light</option>
					<option value="dark">Dark</option>
					<option value="plum">Plum</option>
				</select></label
			>
			<button id="reset">Reset sample tasks</button>
		</div>
		<div id="app"></div>
		<script type="module" src="/preview/app.js"></script>
	</body>
</html>
